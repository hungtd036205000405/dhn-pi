gpio:
  devices:
    - name: led_1
      type: LED
      pin: 17
    - name: button_1
      type: Button
      pin: 18
      pull_up: true
    - name: relay_1
      type: OutputDevice
      pin: 23
      active_high: true

sensors:
  read_interval: 5
  devices: []
  # Example:
  # - name: dht22_1
  #   type: DHT22
  #   pin: 4
  # - name: bme280_1
  #   type: BME280
  #   i2c_address: 0x76

camera:
  enabled: false
  device_index: 0
  width: 640
  height: 480
  fps: 30

camera_pool:
  max_active: 4
  preview_width: 320
  preview_height: 240
  preview_fps: 5
  record_width: 640
  record_height: 480
  record_fps: 10
  record_max_minutes: 5

recording:
  output_dir: recordings
  codec: avc1
  auto_split_minutes: 5

scan:
  network_scan_timeout: 3
  rtsp_ports:
    - 554
    - 8554
  subnet: 192.168.1.0/24

mqtt:
  reconnect_delay: 5
  keepalive: 60
  topics:
    sensors: dev/pi/{device_code}/sensors
    commands: dev/pi/{device_code}/commands
    status: pi/{device_code}/status

device_code: PI-000001
version: 0.0.1

web:
  host: "0.0.0.0"
  port: 8000
  reload: true
  swagger_enabled: true
  app_env: development

scheduler:
  sensor_poll_interval: 5
  heartbeat_interval: 30
